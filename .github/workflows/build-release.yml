# Builds the package in CachyOS's own container (so it links against the libraries a CachyOS PC has) and publishes it as a
# release named <pkgver>-<pkgrel>, with the file's sha256. Steamify downloads it from there; it pins the sha256 itself.
# Run it by hand (Actions -> build-release -> Run workflow), or push a tag like 3.16.31-1.
name: build-release

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos:latest
    steps:
      - name: Tools
        run: |
          pacman-key --init && pacman-key --populate
          pacman -Syu --noconfirm --needed base-devel git sudo
          # CachyOS's makepkg.conf builds for the CPU it runs on (-march=native): the GitHub machine's CPU is not the user's
          # (a 3.16.31-2 build used AVX-512 FP16 and died with SIGILL on a Ryzen). Build for any x86-64 PC instead.
          sed -i -E 's/-march=[^ "]+/-march=x86-64-v2/g; s/-mtune=[^ "]+/-mtune=generic/g' /etc/makepkg.conf
          grep -n -E '^(C|CXX)FLAGS' /etc/makepkg.conf
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/builder/pkg
          chown -R builder:builder /home/builder/pkg
          runuser -u builder -- bash -c 'cd ~/pkg && makepkg -sf --noconfirm --nocheck'
          cd /home/builder/pkg
          pkg=$(ls steamify-gamescope-nvidia-*.pkg.tar.zst | grep -v -- '-debug-' | head -1)
          # The package must really contain both patches and start: a build that silently lacks a patch is not published.
          bsdtar -xOf "$pkg" usr/bin/gamescope > /tmp/gamescope-check
          chmod +x /tmp/gamescope-check
          strings -a /tmp/gamescope-check | grep -q drm_gbm_scanout || { echo "the GBM scan-out patch is missing from the binary" >&2; exit 1; }
          strings -a /tmp/gamescope-check | grep -q xwayland_ui_native || { echo "the UI-native patch is missing from the binary" >&2; exit 1; }
          # Nothing beyond the baseline ISA may be in it (AVX-512 and friends are not on every CPU).
          if objdump -d /tmp/gamescope-check | grep -m3 -E '\bzmm[0-9]+|\bvmovw\b|\{%k[0-7]\}'; then
              echo "the binary uses instructions that are not on every x86-64 CPU" >&2; exit 1
          fi
          echo "ISA check passed: no AVX-512 in the binary"
          /tmp/gamescope-check --version 2>&1 | head -2
          sha256sum "$pkg" > "$pkg.sha256"
          cat "$pkg.sha256"
          tag=${pkg#steamify-gamescope-nvidia-}; tag=${tag%-x86_64.pkg.tar.zst}
          echo "PKG=$pkg" >> "$GITHUB_ENV"
          echo "RELTAG=$tag" >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELTAG }}
          files: |
            /home/builder/pkg/${{ env.PKG }}
            /home/builder/pkg/${{ env.PKG }}.sha256

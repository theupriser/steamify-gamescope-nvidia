# DRAFT, not run yet. Daily: is there a new gamescope release, and does the GBM patch still apply to it?
#  - applies cleanly  -> a pull request bumps UPSTREAM_VERSION (and the PKGBUILD's pkgver)
#  - does not apply   -> an issue asks for the patch to be ported (done by hand / with a local Claude: CI has no API key)
# Nothing is merged or released without a person reviewing the pull request.
# Needs: "Allow GitHub Actions to create pull requests".
name: check-upstream

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      newer: ${{ steps.check.outputs.newer }}
      applies: ${{ steps.check.outputs.applies }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: bash scripts/check-upstream.sh

  bump:
    needs: check
    if: needs.check.outputs.newer == 'yes' && needs.check.outputs.applies == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump the version
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          echo "$LATEST" > UPSTREAM_VERSION
          sed -i "s/^pkgver=.*/pkgver=$LATEST/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          branch="bump-$LATEST"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -am "gamescope $LATEST (the patch applies as is)"
          git push origin "$branch"
          gh pr create --title "gamescope $LATEST" --body "The GBM scan-out patch applies to gamescope $LATEST without changes. Build it and look at the picture on an NVIDIA PC before merging."

  needs-port:
    needs: check
    if: needs.check.outputs.newer == 'yes' && needs.check.outputs.applies == 'no'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          title="gamescope $LATEST: the GBM patch no longer applies"
          if [[ -n "$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[].number')" ]]; then
            echo "issue for $LATEST already exists"; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "gamescope $LATEST is out and gamescope-gbm-scanout.patch does not apply to it. Port the patch (keep its intent: GBM-allocated scan-out buffers, opt-in through gamescope_drm_gbm_scanout), check gamescope-ui-native.patch still applies on top, set UPSTREAM_VERSION and the PKGBUILD's pkgver, and open a pull request. Run it with a local Claude: \`claude \"port the patch for gamescope $LATEST\"\`."
